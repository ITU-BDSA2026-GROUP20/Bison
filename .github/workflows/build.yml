name: Build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [ SimpleDB, Bison.CLI, Bison.Core, Bison.CSVDBService ]
    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore
        working-directory: ./src/${{ matrix.project }}

      - name: Build
        run: dotnet build --no-restore
        working-directory: ./src/${{ matrix.project }}
